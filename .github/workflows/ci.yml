name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # NEXT_PUBLIC_* vars are inlined by Next.js at BUILD time, not read live by an
      # already-built production bundle at "next start" runtime — so this must be set
      # here (present during the Build step below), not only when next-server.mjs later
      # spawns "next start" for the test server. Locally this is masked by .env.local
      # (gitignored, supplies the same value at build time), which is why this only
      # surfaced in CI, where no .env.local exists. Matches next-server.mjs's own
      # fallback value so behavior stays identical either way.
      NEXT_PUBLIC_SUPPORT_EMAIL: "qavelixhq@gmail.com"
      # tests/integration/entitlements-db.test.mjs and stripe-billing-db.test.mjs exercise
      # real atomicity/idempotency guarantees against a real database and gracefully skip
      # (never fail) when these are unset — see each file's own skip logic, unchanged here.
      # DATABASE_URL must point at a dedicated CI/test Neon branch, never production: this
      # suite inserts and deletes throwaway rows. The app's own Neon serverless driver
      # (src/lib/server/db/client.ts) requires a real Neon endpoint, so this cannot be a
      # generic Postgres service container. STRIPE_SECRET_KEY must be a Stripe *test-mode*
      # key — the test itself refuses to run against anything not prefixed sk_test_.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run db:migrate

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        run: npm run test
